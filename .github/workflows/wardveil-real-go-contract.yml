name: Wardveil source-owned Go/Mesh health contract (isolated)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  wardveil-go-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Mesh fixture with no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # official v7 tag verified 2026-11-09
        with:
          persist-credentials: false
      - name: Checkout reviewed Wardveil Go source at immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoreeCloud/wardveil
          ref: a79624bbe0846ca37192fc3dd9386901a9e57088
          path: wardveil-source
          persist-credentials: false
      - name: Setup Wardveil's declared Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # official v7 tag verified 2026-11-09
        with:
          go-version-file: wardveil-source/go.mod
          cache: false
      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # official v4 tag verified 2026-11-09
        with:
          node-version: '24'
      - name: Verify reviewed source identity and dependency-free Go module
        working-directory: wardveil-source
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '41ff4766719e87a3f5399359d0e721cce5df9493'
          test "$(git hash-object internal/httpapi/server.go)" = '1a4242df290422f0e4ecaa151e0fb694ff195151'
          test "$(git hash-object cmd/wardveil/main.go)" = 'd8d249f8fcc64322957dd4d3fc12c30f9ebe0854'
          test "$(git hash-object internal/store/store.go)" = '0d2a92b8c3d4aadf774e03bedcfa61a3a3d26e6d'
          test "$(git hash-object internal/httpapi/status_contract_test.go)" = '763eb5514b8e8ba16b5c0e87899d4f5c38600124'
          test "$(go list -m all)" = 'github.com/GoreeCloud/wardveil'
      - name: Build reviewed real Wardveil Go service without module network access
        working-directory: wardveil-source
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
        run: |
          set -euo pipefail
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/wardveil-dev" ./cmd/wardveil
      - name: Exercise Wardveil's genuine Go handler under fault-injected journal failure
        working-directory: wardveil-source
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
        run: go test -mod=readonly ./internal/httpapi -run '^(TestUncertainJournalReturnsUnavailable|TestStatusContract.*)$' -count=1
      - name: Verify Mesh health and status-only permissions against genuine Go process
        shell: bash
        run: node examples/owner-contracts/wardveil-real-go.smoke.mjs "$RUNNER_TEMP/wardveil-dev"
