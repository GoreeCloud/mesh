name: Synthetic Mesh contract checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Official actions/checkout v4 tag resolved to this commit on 2026-11-09.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Official actions/setup-node v4 tag resolved to this commit on 2026-11-09.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
