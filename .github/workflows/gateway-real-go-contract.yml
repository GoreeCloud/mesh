name: Pinned Gateway Go console and Mesh health contract (isolated)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gateway-go-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Mesh fixture without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout reviewed Gateway Go source at immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoreeCloud/gateway
          ref: 09d4f54efcd0f97d4bdb82dbe31f331d6370e21a
          path: gateway-source
          persist-credentials: false
      - name: Setup Gateway's declared Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: gateway-source/go.mod
          cache: false
      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact reviewed source and module metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C gateway-source rev-parse HEAD)" = '09d4f54efcd0f97d4bdb82dbe31f331d6370e21a'
          test "$(git -C gateway-source hash-object main.go)" = '0f3283f9c8cb74e7321ede7232ec46fdcd814f96'
          test "$(git -C gateway-source hash-object internal/gateway/http.go)" = '0c6a3e108d8f8b52746665e57355e1672c84b882'
          test "$(git -C gateway-source hash-object go.mod)" = 'ea6f7c46a6057f6ab8f2710d21e15cf29aff94c3'
          test "$(git -C gateway-source hash-object go.sum)" = '2a43d55cfd20e2caea25fb8bca79dee853af7c29'
      - name: Build the pinned Gateway React assets required by go:embed
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix gateway-source/web --ignore-scripts
          npm run build --prefix gateway-source/web
      - name: Resolve locked Go dependencies and verify downloaded modules
        working-directory: gateway-source
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Compile and source-test genuine isolated Gateway console
        working-directory: gateway-source
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go test -mod=readonly ./internal/gateway -run '^(TestAPIAuthenticationAndWriteGates|TestManagementHostAndAuthorizationHardening|TestIsolatedTrustedLocalHTTPS)$' -count=1
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/gateway-console-dev" .
      - name: Validate Mesh contract against the genuine Gateway console child
        shell: bash
        env:
          GC_MESH_GATEWAY_ISOLATED_TEST: '1'
        run: node examples/owner-contracts/gateway-real-go.smoke.mjs "$RUNNER_TEMP/gateway-console-dev"
