name: Pinned current Gateway Go health and Mesh contract (isolated)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gateway-go-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout Mesh without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout immutable reviewed current first-party Gateway source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GoreeCloud/gateway
          ref: 35f005ecd0c77843b912fd07b98d7885c756a1f4
          path: gateway-source
          persist-credentials: false
      - name: Setup source-declared Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: gateway-source/go.mod
          cache: false
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify immutable current Go source, modules and read-only API contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C gateway-source rev-parse HEAD)" = '35f005ecd0c77843b912fd07b98d7885c756a1f4'
          test "$(git -C gateway-source hash-object main.go)" = 'b21a37a37843825d700ea4abe0c484174993218f'
          test "$(git -C gateway-source hash-object internal/gateway/http.go)" = 'c04fc3264959b447feaddc2775e9eecde26b3b46'
          test "$(git -C gateway-source hash-object go.mod)" = 'e1349bc5190b2e75c8eb4c8746c96caf4fb4f0b7'
          test "$(git -C gateway-source hash-object go.sum)" = 'ff67b42e5371a51f51667b581516b1e044b48a83'
          grep -Fq 'module github.com/GoreeCloud/gateway' gateway-source/go.mod
          grep -Fq 'r.URL.Path == "/api/health"' gateway-source/internal/gateway/http.go
          grep -Fq 'case "/api/status":' gateway-source/internal/gateway/http.go
          grep -Fq 'GATEWAY_ADMIN_TOKEN' gateway-source/main.go
          test ! -e gateway-source/cmd/console/main.go
      - name: Verify and compile actual current Gateway React console
        working-directory: gateway-source/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/index.html
      - name: Verify real Go Caddy dependencies and targeted protected console tests
        working-directory: gateway-source
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly -race -count=1 ./internal/gateway -run '^(TestAPIAuthenticationAndWriteGates|TestManagementHostAndAuthorizationHardening)$'
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/gateway-console-dev" .
      - name: Test private disposable Go Gateway console with strict Mesh projection
        shell: bash
        env:
          GC_MESH_GATEWAY_ISOLATED_TEST: '1'
        run: node examples/owner-contracts/gateway-real-go.smoke.mjs "$RUNNER_TEMP/gateway-console-dev"
