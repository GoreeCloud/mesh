name: Source-pinned Go DNS process-only health contract (isolated)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dns-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Mesh without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact reviewed Go DNS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoreeCloud/DNS
          ref: 5e43d32d4efcc39aa129021e4ef43d6a0020e63c
          path: dns-source
          persist-credentials: false
      - name: Setup Node 24 for synthetic boundary tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify immutable Go DNS source and process-only semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C dns-source rev-parse HEAD)" = '5e43d32d4efcc39aa129021e4ef43d6a0020e63c'
          test "$(git -C dns-source hash-object internal/server/server.go)" = 'a357a3648f02db9a998d75b0f6ad71457dc66ec4'
          test "$(git -C dns-source hash-object README.md)" = 'b714614551cc95bad4f22908f1cdd78d723b9002'
          grep -Fq 'mux.HandleFunc("GET /healthz"' dns-source/internal/server/server.go
          grep -Fq 'w.Header().Set("Content-Type", "text/plain; charset=utf-8")' dns-source/internal/server/server.go
          grep -Fq 'w.Write([]byte("running\n"))' dns-source/internal/server/server.go
          grep -Fq 'Process HTTP response only; does not test DNS upstream' dns-source/README.md || \
            grep -Fq 'does not test DNS upstream' dns-source/README.md
      - name: Validate explicit default-deny process-only DNS fixture
        shell: bash
        env:
          NODE_ENV: test
        run: node --test examples/owner-contracts/dns-health.test.mjs
