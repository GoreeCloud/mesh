schema_version: '0.4'
component:
  type: platform-system
  id: goreecloud-mesh
  product_name: GoreeCloud Mesh
  repository: GoreeCloud/mesh
lifecycle: development
version: '0.3'
supported_platforms:
- linux
api:
  versions:
  - v1
  endpoints:
  - name: health
    url: /healthz
    purpose: Process-availability signal; not a complete production-readiness or dependency-health verdict.
  - name: private-api
    url: /v1/
    purpose: Private-first service discovery, reachability registry, transport/evidence, and transitional graph/policy API namespace. Existing coordination-oriented surfaces do not grant Mesh synchronization authority.
  - name: evidence
    url: /v1/evidence/envelopes
    purpose: Authenticated bounded evidence transport, inspection, and delivery surface.
platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
    - README.md
    notes: GoreeCloud Manager remains the central administration authority. A direct Manager-to-Mesh operational integration is planned and is not claimed as implemented here.
  privacy_shield:
    result: applicable-migration-required
    version: null
    evidence:
    - docs/platform-conformance.json
    - docs/privacy-everkeep.md
    notes: Source-level privacy authority, minimization, retention, and evidence boundaries exist, while approved runtime Privacy Shield integration and current-contract acceptance remain pending.
  wardveil_security:
    result: applicable-migration-required
    version: null
    evidence:
    - docs/platform-conformance.json
    - docs/identity-trust.md
    notes: Source-level trust and fail-closed security boundaries exist, while approved Wardveil runtime adapter evidence and current-contract acceptance remain pending.
  everkeep:
    result: applicable-migration-required
    version: null
    evidence:
    - docs/everkeep.adoption.json
    - docs/everkeep.acceptance.json
    - docs/platform-conformance.json
    notes: Mesh has source-level continuity adoption and acceptance contracts, but production backup, export, restore, corruption recovery, and current-contract Everkeep acceptance remain pending.
  glaze_ui:
    result: applicable-migration-required
    version: 2.2.0
    evidence:
    - WEBSITE.md
    - website/glaze.lock.json
    - docs/platform-conformance.json
    notes: The standalone public Mesh website declares a historical pinned Glaze UI 2.2.0 consumer state, while the current Contract 0.4 Stable consumer target is 1.6.0 and the administrative Mesh product interface plus complete product-level Glaze acceptance remain unfinished.
  mesh:
    result: not-applicable-justified
    version: '0.3'
    evidence:
    - README.md
    - docs/architecture.md
    - docs/api.md
    notes: This repository implements the GoreeCloud Mesh connectivity, reachability, and service-communication authority itself; a separate Mesh-to-Mesh platform integration is not applicable. Existing coordination-oriented source surfaces are transitional and do not expand Mesh authority beyond the adopted Integral Platform architecture.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-migration-required
    version: null
    evidence:
    - contracts/mesh.identity-verification.json
    - docs/identity-trust.md
    - docs/platform-conformance.json
    notes: A source-level verifier and scoped service-identity trust boundary exist, while a deployed GoreeCloud Identity verifier, production credential mechanism, and current-contract acceptance remain pending.
  policy:
    result: applicable-blocked
    version: null
    evidence:
    - README.md
    - docs/api.md
    notes: Mesh contains transitional local coordination-oriented policy source, but GoreeCloud Policy is the separate platform policy authority. No accepted GoreeCloud Policy runtime decision, distribution, or enforcement-coordination integration is established for Mesh.
  observability:
    result: applicable-blocked
    version: null
    evidence:
    - README.md
    - docs/platform-conformance.json
    notes: Mesh exposes bounded local health and operational evidence surfaces, but no accepted GoreeCloud Observability telemetry, freshness, completeness, correlation, or production-monitoring integration is established.
health:
  health_endpoint: /healthz
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
    - Protect Mesh durable reachability registry, relationship/source-attestation, runtime-evidence, evidence-envelope, and recovery-evidence state according to accepted Everkeep policy before production dependency.
  restore:
    required: true
    requirements:
    - Validate clean restoration, state integrity, API behavior, and accepted recovery evidence before production or Stable qualification.
  export:
    required: true
    requirements:
    - Keep Mesh reachability/registry state and approved evidence records exportable in documented, independently recoverable forms.
  portability:
    required: true
    requirements:
    - Preserve replaceable storage and documented contracts so Mesh does not become an unrecoverable dependency or proprietary data silo.
external_dependencies: []
compatibility:
  platform_contract: '0.4'
  glaze_ui_required: 1.6.0
  requires:
  - goreecloud-platform-contract==0.4
  - glaze-ui==1.6.0
  provides:
  - mesh-api-v1
evidence:
  acceptance_tests: []
  release: []
conformance:
  status: nonconformant
  validated_at: null
  evidence:
  - README.md
  - docs/architecture.md
  - docs/api.md
  - docs/platform-conformance.json
  - contracts/mesh.platform-evidence-plane.v1.json
  - contracts/mesh.identity-verification.json
  - WEBSITE.md
  blockers:
  - GoreeCloud Mesh remains in Development and is not production or Stable accepted.
  - Direct GoreeCloud Manager integration remains planned.
  - GoreeCloud Sync is separately governed and Mesh-to-Sync reachability/transport integration and production acceptance remain pending.
  - Existing Registry/Graph/Policy/Event coordination-oriented source surfaces require controlled decomposition or reclassification so they do not duplicate GoreeCloud Sync state-coordination authority or GoreeCloud Policy authority.
  - A deployed GoreeCloud Identity verifier and production authorization path remain pending.
  - Wardveil Security and Privacy Shield runtime adapter evidence and acceptance remain pending.
  - Everkeep production backup, export, restore, and recovery acceptance remain pending.
  - GoreeCloud Policy runtime integration and Mesh-specific decision/distribution/enforcement acceptance remain pending.
  - GoreeCloud Observability telemetry, health correlation, freshness/completeness, diagnostics, and production-monitoring acceptance remain pending.
  - The administrative Mesh product interface and product-level Glaze UI acceptance remain incomplete.
  - Current Stable Glaze UI 1.6.0 reconciliation and acceptance remain incomplete.
  - Production Monitoring, Gateway, and Network adapters remain pending.
  - Target-environment runtime, rollback, failure-mode, publication, and production acceptance remain pending.
